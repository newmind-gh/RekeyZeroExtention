      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1435" cy="80" r="190" fill="#dff5ed" opacity="0.75"/>
  <circle cx="1360" cy="500" r="230" fill="#e6efff" opacity="0.7"/>

